# 개발·실행(runIde)에 쓸 PyCharm 버전. 다운로드가 크므로(~1GB) 처음 한 번만 받는다.
platformVersion=2025.3

# 이미 설치된 PyCharm을 쓰려면 아래 줄의 주석을 풀고 경로를 지정하세요 (다운로드 생략, 더 빠름).
#   macOS  : /Applications/PyCharm.app/Contents
#   Windows: C:/Program Files/JetBrains/PyCharm 2025.3
#   Linux  : /opt/pycharm
# pycharmPath=/Applications/PyCharm.app/Contents

org.gradle.jvmargs=-Xmx2g
kotlin.stdlib.default.dependency=false
